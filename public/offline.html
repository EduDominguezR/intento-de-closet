<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFBFD" />
    <title>Closetly — Sin conexión</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fffbfd;
        color: #4a4458;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #e6e0f8;
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 12px 32px rgba(74, 68, 88, 0.08);
      }
      .badge {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 12px;
        background: #fff9db;
        color: #4a4458;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
      }
      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.5;
        color: #6b6580;
      }
      button {
        min-height: 44px;
        padding: 10px 22px;
        border: none;
        border-radius: 16px;
        background: #6e61be;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">Modo sin conexión</span>
      <h1>Tu closet está esperándote</h1>
      <p>
        No pudimos cargar esta vista porque no tienes conexión a internet en este momento.
        Vuelve a intentarlo o abre tu closet guardado en caché.
      </p>
      <button type="button" onclick="window.location.href='/closet'">Ir a Mi Closet</button>
    </main>
  </body>
</html>
